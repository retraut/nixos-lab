general {
    lock_cmd = pidof hyprlock || $HOME/.local/bin/nixos-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Match the five-minute lock policy used by the Omarchy workstation. The
# display powers down shortly afterwards and wakes on the next input event.
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/nixos-lock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
